[package]
name = "fors-check"
version.workspace = true
license.workspace = true
edition = "2024"
publish = false

[dependencies]
fors-diag = { path = "../fors-diag" }
fors-lex = { path = "../fors-lex" }
fors-syntax = { path = "../fors-syntax" }
fors-index = { path = "../fors-index" }
fors-resolve = { path = "../fors-resolve" }
fors-fir = { path = "../fors-fir" }
# §4.3: `fors-query` is the engine and depends on `std` only; the Fors query
# set (§9.1's node set) lives here, so the edge runs this way and never back.
fors-query = { path = "../fors-query" }

[dev-dependencies]
# D7's per-exit multiset is asserted against FMIR F4's own oracle,
# `fors_fmir::exit::expected_pending` (design §13, "Interface to FMIR
# lowering": the verifier check is an assertion against D7, never a
# re-derivation). Test-only; the checker itself never reads `fors-fmir`.
fors-fmir = { path = "../fors-fmir" }

[lints]
workspace = true
