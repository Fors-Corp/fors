[package]
name = "fors-oracle"
version.workspace = true
license.workspace = true
edition = "2024"
publish = false

# F10 (design docs/design/fmir-interpreter.md §7, §9 F10;
# compiler-architecture.md §8): the FMIR-level typed random program
# generator, the differential runner, and the three-stage minimiser. A
# library of test infrastructure: nothing in the compiler depends on it.
[dependencies]
fors-fmir = { path = "../fors-fmir" }
fors-fir = { path = "../fors-fir" }
fors-index = { path = "../fors-index" }
fors-interp = { path = "../fors-interp" }
fors-lower = { path = "../fors-lower" }
fors-check = { path = "../fors-check" }
fors-resolve = { path = "../fors-resolve" }
fors-syntax = { path = "../fors-syntax" }
fors-lex = { path = "../fors-lex" }

# The seeded-miscompile hook is enabled HERE ONLY, and only for this crate's
# tests (`tests/seeded.rs` asserts no other manifest enables it).
[dev-dependencies]
fors-lower = { path = "../fors-lower", features = ["seeded-miscompile"] }

[lints]
workspace = true
