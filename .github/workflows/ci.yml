name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Linux only: benchmarks run on the pinned M1 box, never on shared runners.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup update stable --no-self-update && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Rust tests (zero warnings)
        run: cargo test --workspace
        env:
          RUSTFLAGS: -D warnings
      - name: Reference parser agrees with the corpus expectations
        run: |
          python3 tools/ref/fors_parse.py tests/conformance | tail -1 | grep -qx 'bad: 0'
      - name: Spec-in-context pack is up to date
        run: python3 tools/specpack/gen.py --check
