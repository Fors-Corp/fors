name = "stream"
category = "parallel"
description = """
STREAM triad, a memory-bandwidth-bound kernel: on this machine parallel efficiency
here is capped by memory bandwidth, not by the language, and no ">= 90% parallel
efficiency" claim in this project may be gated on this kernel's scaling. Arguments:
N, R, threads. Three arrays of N doubles: b[i] = (i % 7) + 1, c[i] = (i % 5) + 1,
a[i] = 0, scalar s = 3.0. The index range [0, N) is split into contiguous blocks,
one per thread: block i (0-indexed) owns indices [i*N/threads, (i+1)*N/threads).
Threads are spawned once (not per repetition); each thread initialises b, c and a
for its own block (first-touch - initialisation is part of the timed program) then
performs R repetitions of a[i] = b[i] + s * c[i] over its own block. After joining,
a single serial pass sums a[] (all values are small integers, so the result is
exact in doubles). Print the sum as an integer (no decimal point, no exponent).
"""
reference = "c"
threads = [1, 2, 4, 6, 8]
# bound: STREAM triad's arithmetic intensity is fixed and tiny (2 flops per 24 bytes moved =
# 0.083 FLOP/byte, independent of N) regardless of machine; classification per
# docs/spec/06-measurement.md Tier A table and its own description above (R16: gated on
# fraction of measured roofline, never a single efficiency ratio).
bound = "bandwidth"
# deterministic: each thread first-touches and writes only its own contiguous index block of
# a[]; the final sum is a single serial pass over the whole array (fixed index order) done
# after join, in every implemented language (c, c-fma, rust, go, swift, zig, java, node, deno, python where
# present), and verified empirically by `run.py determinism`, which runs EVERY declared thread
# count at the check size and requires byte-identical stdout (python uses processes + shared memory, same block-disjoint
# pattern). Values are integers exactly representable in double (spec guarantees this), so the
# serial sum is exact regardless of how the array was partitioned while being written.
deterministic = true

[sizes]
check = ["100000", "3"]
bench = ["20000000", "130"]
