name = "zig"
display = "Zig (ReleaseFast)"
source = "main.zig"
probe = ["zig", "version"]
# Verified with zig 0.16.0. ReleaseFast disables safety checks. Zig ports exist for: hello, nbody,
# spectral-norm, fannkuch, binary-trees, hashmap, mandelbrot, matmul, reduce (all kernels).
build = ["zig", "build-exe", "-O", "ReleaseFast", "-mcpu=native", "-femit-bin={out}/main", "{src}/main.zig"]
run = ["{out}/main"]
artifact = "{out}/main"
